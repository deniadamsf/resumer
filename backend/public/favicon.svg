<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="resumerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#resumerGrad)"/>
  <!-- Inner border hairline -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#3A506B" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Executive R Monogram -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-1">R</text>
  <!-- Subtle accent dot -->
  <circle cx="48" cy="46" r="3" fill="#047857"/>
</svg>
