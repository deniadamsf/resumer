name: resumer
description: "Resumer - AI ATS CV Maker, Score Checker & Job Matcher"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  image_picker: ^1.1.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
